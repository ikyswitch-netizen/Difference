<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOPO OUTLIER</title>
<style>
html,body{margin:0;height:100%;background:#0a0d14;color:#f3f6ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{display:grid;place-items:center}.loading{font-size:14px;letter-spacing:.12em;color:#95a0b8}
</style>
</head>
<body>
<div class="loading">LOADING…</div>
<script>
(async()=>{
  const files=['bundle/g1.txt','bundle/g2.txt','bundle/g3.txt','bundle/g4.txt'];
  try{
    if(typeof DecompressionStream==='undefined') throw new Error('This browser does not support DecompressionStream.');
    const chunks=await Promise.all(files.map(async f=>{
      const r=await fetch(f,{cache:'no-store'});
      if(!r.ok) throw new Error(f+' '+r.status);
      return (await r.text()).trim();
    }));
    const b64=chunks.join('');
    const raw=atob(b64);
    const bytes=new Uint8Array(raw.length);
    for(let i=0;i<raw.length;i++) bytes[i]=raw.charCodeAt(i);
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.body.innerHTML='<pre style="white-space:pre-wrap;padding:24px">Load failed: '+String(err)+'</pre>';
  }
})();
</script>
</body>
</html>
